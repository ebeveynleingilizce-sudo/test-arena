<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>Test Arena</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#fff8ed;font-family:system-ui,sans-serif;padding:24px}main{max-width:580px;width:100%;padding:32px;border:1px solid #344156;border-radius:24px;background:#14243c}h1{font-size:28px}p{line-height:1.7}a{color:#ffb43d}</style></head><body><main role="status"><h1>Test Arena açılıyor…</h1><p>Uygulama yeniden kullanıma açık.</p><p><a href="./">Uygulamayı aç</a></p></main><script>
// Recover devices still controlled by the previous maintenance worker.
const openApp=()=>location.replace('./');
if('serviceWorker' in navigator){
 navigator.serviceWorker.addEventListener('controllerchange',openApp,{once:true});
 navigator.serviceWorker.register('./service-worker.js',{scope:'./',updateViaCache:'none'}).then(async reg=>{
  const apply=()=>reg.waiting?.postMessage({type:'SKIP_WAITING'});
  reg.addEventListener('updatefound',()=>reg.installing?.addEventListener('statechange',apply));
  apply();await reg.update();apply();
  if(!reg.installing&&!reg.waiting)openApp();
 }).catch(()=>{});
}else openApp();
</script></body></html>
